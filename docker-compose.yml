services:
  postgres:
    image: postgres:16-alpine
    container_name: smart_home_postgres
    environment:
      POSTGRES_DB: smart_home
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./apps/smart_home/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d smarthome"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  temperature-api:
    build:
      context: ./apps/temperature-api
      dockerfile: Dockerfile
    container_name: temperature_api
    environment:
      PORT: "8081"
    ports:
      - "8081:8081"
    restart: unless-stopped

  smart_home:
    build:
      context: ./apps/smart_home
      dockerfile: Dockerfile
    container_name: smart_home_app
    environment:
      PORT: ":8080"
      DATABASE_URL: "postgres://postgres:postgres@postgres:5432/smarthome?sslmode=disable"
      TEMPERATURE_API_URL: "http://temperature-api:8081"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      temperature-api:
        condition: service_started
    restart: unless-stopped

volumes:
  postgres_data: